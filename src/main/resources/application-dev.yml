server:
  port: 9090

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://simon996.com:5506/accounting_management_api?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: simon996@mysql8

  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

sa-token:
  token-name: satoken
  timeout: 2592000         # Token 过期时间（秒）30天
  active-timeout: -1       # 不限制活跃时间
  is-concurrent: true      # 允许多端登录
  is-share: true           # 多端共享同一 token
  token-style: uuid
  is-log: true
